# SQL Server 2022 cho môi trường phát triển (macOS / Linux / Windows có Docker).
# 1. Tạo file .env cạnh file này:  MSSQL_SA_PASSWORD=<mật khẩu mạnh, >= 8 ký tự, có hoa/thường/số/ký tự đặc biệt>
# 2. docker compose up -d
# 3. SQL_PASSWORD=<mật khẩu> ./scripts/db_init.sh --docker imcp-mssql
# Lưu ý: chạy image này nghĩa là bạn đồng ý điều khoản SQL Server Developer Edition (ACCEPT_EULA).
# Apple Silicon: bật "Use Rosetta for x86_64/amd64 emulation" trong Docker Desktop.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: imcp-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Đặt MSSQL_SA_PASSWORD trong file .env}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql-data:
