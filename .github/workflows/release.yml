# Release: khi merge vào main -> đóng gói bản cài macOS (.dmg) + Windows (setup.exe, .zip portable)
# và tạo GitHub Release đính kèm file cài. Phiên bản lấy từ project(VERSION ...) trong CMakeLists.txt.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    name: Đóng gói macOS
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5
      - name: Cài Qt, ODBC, FreeTDS, Ninja
        run: brew install qt qt-unixodbc unixodbc freetds ninja
      - name: Đóng gói .dmg
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qlttta-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Đóng gói Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cài Qt 6.8 LTS + MinGW + Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_mingw"
          tools: "tools_mingw1310 tools_ninja"
          cache: true
      - name: Thêm MinGW và Ninja vào PATH
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$env:IQTA_TOOLS\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Cài Inno Setup (nếu runner chưa có)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Đóng gói setup.exe + zip
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: qlttta-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Tạo GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tạo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          Bản cài tự động từ commit ${GITHUB_SHA::7} trên nhánh main.

          | Hệ điều hành | File |
          |---|---|
          | Windows 10/11 (x64) | \`QLTTTA-${VERSION}-windows-x64-setup.exe\` (cài đặt) hoặc \`...-portable.zip\` (giải nén là chạy) |
          | macOS 12+ (Apple Silicon) | \`QLTTTA-${VERSION}-macos-arm64.dmg\` |

          Cần SQL Server có CSDL QLTTTA (khởi tạo bằng \`scripts/db_init\`). Hướng dẫn mở ứng dụng lần đầu
          và tài khoản demo: xem \`docs/SETUP.md\`.
          EOF
          gh release create "$TAG" dist/* --title "QLTTTA ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md --target "$GITHUB_SHA"
