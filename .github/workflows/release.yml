# Release installers: on a merge into main -> build the macOS (.dmg) + Windows (setup.exe, portable .zip) installers
# and create a GitHub Release with them attached. A manual run (workflow_dispatch) on another branch only builds
# the installers. The version comes from project(VERSION ...) in CMakeLists.txt; the tag adds the run number.
# The release notes = install table and first-launch steps (below) + the PRs since the previous release
# (--generate-notes). Each installer checks the operating system: the Windows setup has MinVersion
# (packaging/windows/installer.iss), the .dmg has the LSMinimumSystemVersion written by package-macos.sh.
# Two safeguards before and after the Release is created (the job "publish"):
#   - approval: the job runs in the environment "release" (Settings > Environments), which accepts only main and
#     waits for the team lead to click "Review deployments > Approve". The builds run first without waiting, so the
#     approval only decides whether the installers are published.
#   - provenance: every installer gets a signed build attestation (Sigstore, stored by GitHub) saying "built by this
#     workflow from this commit". Anyone can check a download: gh attestation verify <file> --repo <owner>/<repo>.
name: Release installers (Windows + macOS)
# Manual runs only build the installers, and their title says so; a merge into main keeps GitHub's default title
# (the commit message)
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Test the installers on {0} (no release)', github.ref_name)
  || '' }}

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default: the build jobs run code from outside the repository (brew, choco, install-qt-action) and
# only upload artifacts, so they get no write token. The job "publish" has its own permissions block.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    name: Build the macOS .dmg (Apple Silicon)
    # Pinned, not macos-latest: the Homebrew libraries in the .dmg are built for the runner's macOS, so the runner
    # sets the oldest macOS the app supports (macos-15: Sequoia and later; macos-latest = macOS 26 only)
    runs-on: macos-15
    outputs:
      min-macos: ${{ steps.min-macos.outputs.version }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt, ODBC, FreeTDS, Ninja
        run: brew install qt qt-unixodbc unixodbc freetds ninja
      - name: Build the .dmg
        run: ./scripts/package-macos.sh
      - name: Read the minimum macOS version for the release notes
        id: min-macos
        run: |
          VERSION=$(plutil -extract LSMinimumSystemVersion raw build/macos-release/src/app/QLTTTA.app/Contents/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "The .dmg runs on macOS $VERSION or later" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: qlttta-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Build the Windows setup.exe + portable .zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt 6.8 LTS + MinGW + Ninja
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.8.3"
          arch: "win64_mingw"
          tools: "tools_mingw1310 tools_ninja"
          cache: true
      - name: Add MinGW and Ninja to PATH
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$env:IQTA_TOOLS\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Inno Setup (if the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build setup.exe + zip
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: qlttta-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release (main only)
    needs: [macos, windows]
    # A manual run from another branch only builds the installers (artifacts); a Release comes from main only
    if: github.ref == 'refs/heads/main'
    # Waits for the approval of the reviewer set on the environment "release" (only main may deploy to it)
    environment: release
    # The workflow-level token is read-only. Publishing needs to write, and the attestation also needs the OIDC token
    # and the attestations API: they are given to this job only (a job-level block replaces the workflow-level one)
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation as this workflow
      attestations: write # store the attestation in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attest the installers (build provenance)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_MACOS: ${{ needs.macos.outputs.min-macos }}
        run: |
          : "${MIN_MACOS:?the macOS job did not report the minimum macOS version}"
          VERSION=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          SETUP_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/docs/SETUP.md"
          cat > notes.md <<EOF
          Installers built automatically from commit ${GITHUB_SHA::7} on main.

          | Operating system | File |
          |---|---|
          | Windows 10 (version 1809 or later) or 11, x64 | \`QLTTTA-${VERSION}-windows-x64-setup.exe\` (installer) or \`...-portable.zip\` (unzip and run) |
          | macOS ${MIN_MACOS} or later, Apple Silicon | \`QLTTTA-${VERSION}-macos-arm64.dmg\` |

          The Windows setup stops on an older Windows, and an older macOS refuses to open the app.
          Requires a SQL Server with the QLTTTA database (initialized with \`scripts/db_init\` from the source code
          below). The UI is available in Vietnamese and English. Database setup and demo accounts: [SETUP.md](${SETUP_URL}).

          ### Verify the download
          Every file has a signed build attestation: it proves the file was built by this repository's release
          workflow from commit ${GITHUB_SHA::7} and was not changed afterwards. With the GitHub CLI:
          \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`

          ### First launch
          - **macOS**: the app is signed by the team, not notarized by Apple, so macOS blocks the first launch of a
            \`.dmg\` downloaded with a browser. Open QLTTTA once and click *Done*, then click *Open Anyway* in
            *System Settings > Privacy & Security*, or run \`xattr -dr com.apple.quarantine /Applications/QLTTTA.app\`
            in Terminal. With the GitHub CLI there is nothing to unblock: a file it downloads is not marked as
            coming from the internet, so the app opens directly:
            \`gh release download ${TAG} --repo ${GITHUB_REPOSITORY} --pattern '*.dmg'\`
          - **Windows**: if SmartScreen says *Windows protected your PC*, click *More info > Run anyway*.

          EOF
          # --generate-notes appends the PRs merged since the previous release ("What's Changed") to notes.md
          gh release create "$TAG" dist/* --title "QLTTTA ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
