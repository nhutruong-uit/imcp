# Checks: fast checks on every PR into develop (the full CI of ci.yml only runs after the merge):
#   - scripts/check_changes.sh: format of the changed C++ lines (clang-format pinned in .clang-format-version),
#     English Conventional Commits without AI attribution, no build output / .env in the repository;
#   - build + unit tests on Linux, incl. tst_conventions (SQL syntax and headers, layers, SQL location, scripts,
#     numbers quoted in the docs) and tst_i18n (translations). No database here: the end-to-end test is excluded.
# develop's branch protection requires this job: a red check blocks the merge. Keep the job name;
# renaming it requires updating the required status checks of develop. A review from the code owner
# (nhutruong-uit, .github/CODEOWNERS) is also required (/imcp-review).
name: Checks

on:
  pull_request:
    branches: [develop]

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (conventions + unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check_changes needs the base branch and every commit of the PR

      - name: Install clang-format (team version) and Ninja
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install -q "clang-format==$(tr -d '[:space:]' < .clang-format-version)"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -qq ninja-build

      - name: Change checks (scripts/check_changes.sh)
        run: ./scripts/check_changes.sh "origin/${{ github.base_ref }}"

      - name: Install Qt 6.8 LTS
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "linux_gcc_64"
          cache: true

      - name: Build and unit tests (incl. tst_conventions, tst_i18n)
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug
          ctest --preset linux-debug -E e2e --output-on-failure
