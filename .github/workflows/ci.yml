# CI: mỗi lần push lên develop/feature và mỗi Pull Request -> build + unit test trên macOS và Windows.
# PR chỉ được merge khi cả 2 job xanh (bật branch protection cho develop/main).
name: CI

on:
  push:
    branches: [develop, "feature/**", "fix/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Cài Qt, ODBC, Ninja (Homebrew)
        run: brew install qt qt-unixodbc unixodbc ninja

      - name: Configure
        run: cmake --preset macos-debug

      - name: Build
        run: cmake --build --preset macos-debug

      - name: Unit test
        run: ctest --preset macos-debug

  windows:
    name: Windows (Qt + MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Qt 6.8 LTS + MinGW + Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_mingw"
          tools: "tools_mingw1310 tools_ninja"
          cache: true

      - name: Thêm MinGW và Ninja vào PATH
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$env:IQTA_TOOLS\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        run: cmake --preset windows-debug

      - name: Build
        run: cmake --build --preset windows-debug

      - name: Unit test
        run: ctest --preset windows-debug
