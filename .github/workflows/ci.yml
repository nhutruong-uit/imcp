# CI: build + unit test trên macOS và Windows. Chỉ chạy khi:
#   - merge vào develop (GitHub tạo sự kiện push lên develop; push thẳng develop cũng chạy);
#   - mở/cập nhật PR vào main: BẮT BUỘC, branch protection của main đòi 2 job này xanh mới cho merge;
#   - chạy tay cho nhánh bất kỳ: gh workflow run CI --ref <nhánh>  (hoặc tab Actions > CI > Run workflow).
# Push lên feature/fix và PR vào develop KHÔNG tự chạy CI: chạy scripts/test_all.sh trên máy trước khi merge.
# Merge vào main chạy release.yml (đóng gói), không chạy lại CI vì PR vào main đã chạy.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5

      - name: Cài Qt, ODBC, Ninja (Homebrew)
        run: brew install qt qt-unixodbc unixodbc ninja

      - name: Configure
        run: cmake --preset macos-debug

      - name: Build
        run: cmake --build --preset macos-debug

      - name: Unit test
        # -V: in kết quả từng hàm test (PASS/SKIP) để thấy rõ trên log CI; e2e cần CSDL nên được ghi Skipped
        run: ctest --preset macos-debug --output-on-failure -V

  windows:
    name: Windows (Qt + MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cài Qt 6.8 LTS + MinGW + Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_mingw"
          tools: "tools_mingw1310 tools_ninja"
          cache: true

      - name: Thêm MinGW và Ninja vào PATH
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$env:IQTA_TOOLS\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        run: cmake --preset windows-debug

      - name: Build
        run: cmake --build --preset windows-debug

      - name: Unit test
        # -V: in kết quả từng hàm test (PASS/SKIP) để thấy rõ trên log CI; e2e cần CSDL nên được ghi Skipped
        run: ctest --preset windows-debug --output-on-failure -V
