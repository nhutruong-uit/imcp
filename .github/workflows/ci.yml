# CI: build + unit tests (incl. translations) on macOS and Windows. Runs only:
#   - when something is merged into develop (GitHub raises a push to develop; a direct push to develop also runs);
#   - when a PR into main is opened/updated: REQUIRED, main's branch protection needs both jobs green to merge;
#   - manually for any branch: gh workflow run CI --ref <branch>  (or Actions tab > CI > Run workflow).
# Pushes to feature/fix branches and PRs into develop do NOT run CI: run scripts/test_all.sh locally before merging.
# A merge into main runs release.yml (packaging); CI does not run again because the PR into main already ran it.
# Keep the job names: they are the required status checks of main.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt, ODBC, Ninja (Homebrew)
        run: brew install qt qt-unixodbc unixodbc ninja

      - name: Configure
        run: cmake --preset macos-debug

      - name: Build
        run: cmake --build --preset macos-debug

      - name: Unit test
        # -V: prints every test function (PASS/SKIP) in the CI log; e2e needs a database so it is Skipped
        run: ctest --preset macos-debug --output-on-failure -V

  windows:
    name: Windows (Qt + MinGW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6.8 LTS + MinGW + Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_mingw"
          tools: "tools_mingw1310 tools_ninja"
          cache: true

      - name: Add MinGW and Ninja to PATH
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$env:IQTA_TOOLS\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        run: cmake --preset windows-debug

      - name: Build
        run: cmake --build --preset windows-debug

      - name: Unit test
        # -V: prints every test function (PASS/SKIP) in the CI log; e2e needs a database so it is Skipped
        run: ctest --preset windows-debug --output-on-failure -V
